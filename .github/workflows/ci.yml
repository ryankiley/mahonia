# The checks a PR has to survive: types, tests, a build, and the bundle ratchet.
#
# WHY: all four already existed as npm scripts, and none of them ran anywhere. The
# repo has a sizeable test suite, a `typecheck` script, and a first-load budget with a
# hand-kept change-log of every measurement — a genuinely careful set of gates that
# nothing enforced, so a PR could merge with failing tests, TypeScript errors, or a
# blown budget and nothing would say so. Vercel's build runs `nuxt build`, which
# transpiles but does NOT type-check, so the deploy was never the backstop either.
#
# That is not hypothetical: when this workflow was written the first-load budget was
# already over (154.5 KB against 154), from ~3.3 KB that had landed across several
# commits with no build run between them. Nobody was careless — there was simply
# nowhere for the number to surface. See scripts/bundle-budget.mjs.
#
# This file REPORTS, and says one thing back: on a PR it posts what the change costs
# in bytes against main (the `comment` job at the end). Making any of the checks a
# merge blocker is a branch-protection setting in the repo's GitHub settings, not
# something a workflow can declare — a red check here is visible on the PR either way.
name: CI

on:
  pull_request:
  # ...and on main itself, because a green PR is not the same claim as a green
  # main. CI runs against the PR's own branch, and a branch cut days earlier can
  # merge cleanly into a main that has moved under it — git resolves TEXT, and
  # says nothing about whether the two changes still make sense together.
  #
  # That is not hypothetical either: #265 was cut from 77e3019 and squash-merged
  # after #266, #268 and #272 had landed, two of which edited the same component
  # it rewrote most. It applied without a conflict and the merged result was fine
  # — but nothing had run the suite on that combination, and nothing would have
  # said so if it hadn't been. The gap is structural: `pull_request` can only ever
  # test the code as it was proposed, never as it landed.
  push:
    branches: [main]

# One run per ref: a push mid-run makes the older answer irrelevant, and these are
# minutes of compute. PR runs and main runs land in different groups
# (refs/pull/N/merge vs refs/heads/main), so a merge never cancels a PR's own
# check. On main, though, every commit's run is worth finishing: its bundle report
# is the baseline the next PR is measured against, and a cancelled run uploads
# none — three quick merges used to leave the newest baseline three commits
# behind. So only PR runs cancel their predecessor.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Reads the code, says nothing back — no comments, no deploys, no secrets. The
# job that checks out PR code and runs `npm ci`, the tests and the build holds a
# READ-ONLY token, and that matters: actions/checkout persists the job's token in
# .git/config, where every install script, test and build plugin can read it. The
# one thing this workflow does write — the bundle-delta comment on a PR — is a
# second job below with no checkout at all, the same shape as changelog-reminder.
# `actions: read` here is what lets a PR run download the report main's last run
# uploaded; on a public repo it grants nothing else.
permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # A full run is ~4 minutes. Anything past 20 is wedged, and a hung job holds
    # the concurrency slot for six hours by default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # matches .nvmrc + package.json engines
          node-version: 24
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so an obvious break reports in a minute rather than
      # five — but every step runs regardless (`!cancelled()`), because a red
      # typecheck shouldn't hide whether the tests also fail. One PR, one full
      # picture, rather than a queue of one-fix-at-a-time pushes.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Test
        if: '!cancelled()'
        run: npm test

      # BUNDLE_MAPS: hidden client sourcemaps beside the chunks (nuxt.config), so the
      # budget script can say which SOURCE files a chunk's bytes belong to. The JS is
      # byte-identical with or without them; nothing built here is deployed.
      - name: Build
        if: '!cancelled()'
        run: npm run build
        env:
          BUNDLE_MAPS: "1"

      # Reads .output, so it has to follow the build. The report is the same
      # measurement as JSON, per file and per source; on main it is uploaded, and
      # that upload is what the next PR is measured against.
      - name: Bundle budget
        if: '!cancelled()'
        run: npm run bundle-budget -- --report=bundle-report.json

      # Only main's reports are kept — a PR run reads its own from disk, and nothing
      # reads a PR's afterwards. `!cancelled()` rather than success(): a red budget
      # on main is still the honest baseline for the next PR (a build that failed
      # wrote no report, and upload-artifact then has nothing to keep).
      - name: Keep the bundle report
        if: github.event_name == 'push' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: bundle-report.json
          if-no-files-found: ignore

      # THE RECEIPT. What this PR costs against main — first load, total, largest
      # chunk, and which sources moved — posted on the PR whether the gate above
      # went green or red. That last part is the reason it exists: a PR that adds
      # 1.8 KB under the tripwire used to say nothing at all, and ten of those in a
      # row was how the first load grew 30 KB in a summer with every check green.
      #
      # main's number comes from the report main's own run uploaded, not from a
      # second build here: this job runs on the PR's merge commit, so "this build
      # minus the build of the main it was merged onto" is the PR's own
      # contribution. That main is `pull_request.base.sha`, so its run is looked
      # for first; if it has no report yet (still running, or its build failed) the
      # newest push run on main that has one stands in, and the receipt says so.
      # Runs are resolved through the runs API (branch=main, event=push), which the
      # server filters — a fork PR from a branch named "main" can't match it, and
      # there is no page of "the 50 newest artifacts" to fall off.
      #
      # INFORMATIONAL BY DESIGN: bundle-budget is the gate. `continue-on-error`
      # keeps a flaky artifacts API from reddening the check, and `shell: bash`
      # (which adds pipefail) makes the delta script's own failure the step's, so a
      # broken run leaves no delta.md behind for the comment job to post — the PR
      # keeps its previous receipt instead of a blank one.
      - name: Bundle delta vs main
        id: delta
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -f bundle-report.json
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=20" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
          # the PR's own base first, then newest-first as a stand-in
          ordered=$( { grep " $BASE_SHA$" <<<"$runs" || true; grep -v " $BASE_SHA$" <<<"$runs" || true; } )
          art=""; sha=""
          while read -r run_id run_sha; do
            [ -n "$run_id" ] || continue
            art=$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?name=bundle-report" \
              --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
            if [ -n "$art" ]; then sha="$run_sha"; break; fi
          done <<<"$ordered"
          if [ -z "$art" ]; then
            echo "_No bundle report from main yet — the first main run after this workflow landed will upload one._" > delta.md
          else
            gh api "repos/$REPO/actions/artifacts/$art/zip" > base.zip
            unzip -o -q base.zip -d base
            node scripts/bundle-delta.mjs base/bundle-report.json bundle-report.json --sha="$sha" --base="$BASE_SHA" > delta.md
          fi
          cat delta.md >> "$GITHUB_STEP_SUMMARY"

      # …handed to the comment job as an artifact, since that job checks nothing out.
      - name: Keep the delta for the comment
        if: github.event_name == 'pull_request' && steps.delta.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-delta
          path: delta.md
          retention-days: 1

      # Does the SERVER bundle contain the files the server needs at runtime?
      #
      # Nothing else here asks that. The tests import from node_modules, where
      # every dependency is whole; typecheck never looks at a build at all; the
      # bundle budget reads only .output/public. So a file that node-file-trace
      # failed to copy is invisible to all four gates, and the first thing to
      # notice is production.
      #
      # That is not hypothetical. satori 0.33 shapes text with harfbuzz, and
      # harfbuzzjs resolves its wasm as `__dirname + "/hb.wasm"` — a runtime
      # string concat that nft cannot follow, so the build shipped hb.js without
      # it. And because harfbuzzjs builds its wasm promise at import time, the
      # ENOENT arrives as an unhandled rejection that ogCard.ts's try/catch never
      # sees: the instance dies rather than falling back to /og.png. Every gate
      # above was green. See the nitro:init hook in nuxt.config.ts.
      #
      # One asserted path is a narrow guard, deliberately — a general "is the
      # trace complete" check is not a thing you can write. It ratchets the one
      # case that actually bit, and it is the right place to add the next one.
      - name: Server bundle has its runtime assets
        if: '!cancelled()'
        run: test -f .output/server/node_modules/harfbuzzjs/hb.wasm


  # The one write: the bundle-delta comment, from a job with `pull-requests: write`
  # and NO checkout — nothing of the PR's code runs here, so the token it holds is
  # never in a working tree beside `npm ci`. Same-repo PRs only: a fork's PR gets a
  # read-only token regardless, and its delta stays in the job summary. `always()`
  # so a red check still gets its receipt; the download is what decides whether
  # there is one (the delta step uploads only when it succeeded).
  comment:
    needs: check
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Fetch the delta
        id: dl
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bundle-delta

      # One sticky comment per PR, updated in place on every push (the same shape as
      # changelog-reminder's), so the PR carries its current cost and not a history
      # of every push. No delta (the step failed, or its artifact is missing) means
      # no post — the previous receipt stays, rather than being blanked.
      - name: Post the bundle delta
        if: steps.dl.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const MARKER = "<!-- bundle-delta -->";
            const delta = fs.existsSync("delta.md") ? fs.readFileSync("delta.md", "utf8").trim() : "";
            if (!delta) return;
            const body = MARKER + "\n" + delta;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(MARKER));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
