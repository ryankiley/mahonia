# The checks a PR has to survive: types, tests, a build, and the bundle ratchet.
#
# WHY: all four already existed as npm scripts, and none of them ran anywhere. The
# repo has a sizeable test suite, a `typecheck` script, and a first-load budget with a
# hand-kept change-log of every measurement — a genuinely careful set of gates that
# nothing enforced, so a PR could merge with failing tests, TypeScript errors, or a
# blown budget and nothing would say so. Vercel's build runs `nuxt build`, which
# transpiles but does NOT type-check, so the deploy was never the backstop either.
#
# That is not hypothetical: when this workflow was written the first-load budget was
# already over (154.5 KB against 154), from ~3.3 KB that had landed across several
# commits with no build run between them. Nobody was careless — there was simply
# nowhere for the number to surface. See scripts/bundle-budget.mjs.
#
# This file only REPORTS. Making any of these a merge blocker is a branch-protection
# setting in the repo's GitHub settings, not something a workflow can declare — a red
# check here is visible on the PR either way.
name: CI

on:
  pull_request:
  # ...and on main itself, because a green PR is not the same claim as a green
  # main. CI runs against the PR's own branch, and a branch cut days earlier can
  # merge cleanly into a main that has moved under it — git resolves TEXT, and
  # says nothing about whether the two changes still make sense together.
  #
  # That is not hypothetical either: #265 was cut from 77e3019 and squash-merged
  # after #266, #268 and #272 had landed, two of which edited the same component
  # it rewrote most. It applied without a conflict and the merged result was fine
  # — but nothing had run the suite on that combination, and nothing would have
  # said so if it hadn't been. The gap is structural: `pull_request` can only ever
  # test the code as it was proposed, never as it landed.
  push:
    branches: [main]

# One run per ref: a push mid-run makes the older answer irrelevant, and these are
# minutes of compute. PR runs and main runs land in different groups
# (refs/pull/N/merge vs refs/heads/main), so a merge never cancels a PR's own
# check — and on main the newest commit is the one worth an answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# reads the code, says nothing back — no comments, no deploys, no secrets
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # A full run is ~4 minutes. Anything past 20 is wedged, and a hung job holds
    # the concurrency slot for six hours by default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # matches .nvmrc + package.json engines
          node-version: 24
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so an obvious break reports in a minute rather than
      # five — but every step runs regardless (`!cancelled()`), because a red
      # typecheck shouldn't hide whether the tests also fail. One PR, one full
      # picture, rather than a queue of one-fix-at-a-time pushes.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Test
        if: '!cancelled()'
        run: npm test

      - name: Build
        if: '!cancelled()'
        run: npm run build

      # Reads .output, so it has to follow the build.
      - name: Bundle budget
        if: '!cancelled()'
        run: npm run bundle-budget

      # Does the SERVER bundle contain the files the server needs at runtime?
      #
      # Nothing else here asks that. The tests import from node_modules, where
      # every dependency is whole; typecheck never looks at a build at all; the
      # bundle budget reads only .output/public. So a file that node-file-trace
      # failed to copy is invisible to all four gates, and the first thing to
      # notice is production.
      #
      # That is not hypothetical. satori 0.33 shapes text with harfbuzz, and
      # harfbuzzjs resolves its wasm as `__dirname + "/hb.wasm"` — a runtime
      # string concat that nft cannot follow, so the build shipped hb.js without
      # it. And because harfbuzzjs builds its wasm promise at import time, the
      # ENOENT arrives as an unhandled rejection that ogCard.ts's try/catch never
      # sees: the instance dies rather than falling back to /og.png. Every gate
      # above was green. See the nitro:init hook in nuxt.config.ts.
      #
      # One asserted path is a narrow guard, deliberately — a general "is the
      # trace complete" check is not a thing you can write. It ratchets the one
      # case that actually bit, and it is the right place to add the next one.
      - name: Server bundle has its runtime assets
        if: '!cancelled()'
        run: test -f .output/server/node_modules/harfbuzzjs/hb.wasm
