# A GitHub Release per changelog date, cut from the entries the site already renders.
#
# WHY: the changelog is written once, per PR, as a fragment in content/changelog.d,
# and the site is where people read it. GitHub is a second place the same words are
# useful for free — a Release has an Atom feed (/releases.atom), a "Watch → Releases
# only" notification, a permalink, and a tag that makes `git log vA..vB` mean "what
# shipped between those two days". Nothing here is written by hand: the body is the
# day's entries, the title is the date, the version IS the date (see
# scripts/releaseNotes.ts for why CalVer and not SemVer).
#
# A day is released once it is over in the changelog's timezone, so its entries are
# settled. The tag marks main at the end of that day (Pacific); an entry dated D whose
# PR merged on D+1 is in v<D+1>'s range but in release D's notes, because the date is
# the day the entry was written. Notes are rewritten whenever the entries change, so
# a late fragment updates its release; the tag never moves.
#
# Idempotent: every run walks every settled date, creates what's missing, edits what
# differs, and touches nothing else. Safe to re-run by hand.
#
# Paced. The first run on main created four releases in five seconds and the fifth
# got "HTTP 403: Resource not accessible by integration", which is not a permissions
# failure (the four before it had the same token) but GitHub's secondary rate limit
# on content that fans out notifications, and a release does. So a create is followed
# by a pause, and any create or edit that fails is retried with a growing wait before
# the run gives up on it. The 37-day backfill takes a few minutes instead of failing
# at the fifth day and finishing on the next run.
name: Releases

on:
  push:
    branches: [main]
    paths:
      - content/changelog.d/**
      - content/changelog.json
      - scripts/releaseNotes.ts
      - scripts/release-notes.ts
      - .github/workflows/releases.yml
  # a day with no merges still needs yesterday cut: 09:10 UTC is 02:10 Pacific,
  # past midnight either side of daylight saving
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:

concurrency:
  group: releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # the tag anchor is found by date in history; a shallow clone has none
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: postinstall builds the changelog and the catalog, and this
      # job reads the changelog's sources directly (scripts/changelogSources.ts)
      - run: npm ci --ignore-scripts

      - name: Cut or update a release per settled changelog date
        env:
          # A fine-grained personal access token (repository: this one; permissions:
          # Contents read and write, Workflows read and write) in the RELEASES_TOKEN
          # secret, falling back to the workflow's own token when it is absent.
          #
          # NOT the workflow token alone, and the reason took four failed runs to find.
          # Creating a release on a commit creates a tag there, and GitHub judges a new
          # ref by its tree against the default branch: a ref whose workflow files
          # differ from main's is "creating or updating a workflow", which the Actions
          # token may never do (`workflows` is a permission only apps and personal
          # tokens can hold; a workflow cannot grant it to itself). The four oldest
          # dates cut fine because their commits predate any workflow file in the repo;
          # from July 16 every anchor carries an older reseed-catalog.yml than main, and
          # every create answered "HTTP 403: Resource not accessible by integration",
          # with the same command succeeding under a person's token. A git push of the
          # tag says it plainly: "refusing to allow a GitHub App to create or update
          # workflow .github/workflows/reseed-catalog.yml without workflows permission".
          # Going forward the same refusal returns whenever a workflow file changed
          # between a day's anchor and the run, which is any day a ci: PR merges.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
          TZ: America/Los_Angeles
        run: |
          set -euo pipefail
          if [ "$HAS_RELEASES_TOKEN" != "true" ]; then
            echo "::warning::RELEASES_TOKEN is not set. The workflow token cannot tag a commit whose workflow files differ from main's, so most days will fail to cut; add a fine-grained PAT (Contents + Workflows, read and write) as RELEASES_TOKEN."
          fi
          notes() { node node_modules/jiti/lib/jiti-cli.mjs scripts/release-notes.ts "$@"; }
          # gh, retried: a secondary rate limit answers 403 and clears in seconds
          try() {
            local wait
            for wait in 10 30 60 0; do
              if "$@"; then return 0; fi
              [ "$wait" -gt 0 ] || return 1
              echo "  retrying in ${wait}s"; sleep "$wait"
            done
          }

          created=0; updated=0; kept=0
          while IFS=$'\t' read -r date tag; do
            [ -n "$date" ] || continue
            notes --body "$date" > /tmp/body.md
            title=$(notes --title "$date")

            if gh release view "$tag" --json body --jq .body > /tmp/current.md 2>/dev/null; then
              # gh hands back the body without its trailing newline; compare like for like
              if [ "$(cat /tmp/current.md)" = "$(cat /tmp/body.md)" ]; then
                kept=$((kept + 1))
              else
                try gh release edit "$tag" --title "$title" --notes-file /tmp/body.md > /dev/null
                echo "updated $tag"; updated=$((updated + 1))
                sleep 3
              fi
              continue
            fi

            # main at the end of that day, Pacific — or the root commit for a date
            # older than the repository (the first entries predate the first push)
            anchor=$(git log -1 --format=%H --before="$date 23:59:59" origin/main)
            [ -n "$anchor" ] || anchor=$(git rev-list --max-parents=0 origin/main | tail -1)

            # settled releases arrive oldest first, so the last one created is "latest"
            try gh release create "$tag" --target "$anchor" --title "$title" --notes-file /tmp/body.md > /dev/null
            echo "created $tag at ${anchor:0:7}"; created=$((created + 1))
            sleep 5
          done < <(notes --list)

          echo "releases: $created created, $updated updated, $kept unchanged"
